version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25

  pre_build:
    commands:
      - echo "Checking build environment"
      - java -version
      - mvn -version

  build:
    commands:
      - echo "Building Spring Boot application"
      - mvn clean package -DskipTests

  post_build:
    commands:
      - JAR_FILE=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
      - test -n "$JAR_FILE"
      - cp "$JAR_FILE" application.jar
      - printf "web: java -jar application.jar\n" > Procfile
      - ls -la application.jar Procfile

artifacts:
  files:
    - application.jar
    - Procfile
  discard-paths: yes

cache:
  paths:
    - "/root/.m2/**/*"